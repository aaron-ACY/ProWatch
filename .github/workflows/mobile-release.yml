name: Mobile Release & APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/frontend/**'
      - '.github/workflows/mobile-release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag phiên bản Release (để trống sẽ tự lấy từ app.json, VD: v1.0.20)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: mobile/frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: mobile/frontend
        run: npx tsc --noEmit

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache CMake NDK C++ Build (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            mobile/frontend/android/app/.cxx
            mobile/frontend/node_modules/expo-modules-core/android/.cxx
            mobile/frontend/node_modules/react-native-screens/android/.cxx
            mobile/frontend/node_modules/react-native-safe-area-context/android/.cxx
            mobile/frontend/node_modules/react-native-svg/android/.cxx
          key: ${{ runner.os }}-cmake-cxx-${{ hashFiles('mobile/frontend/package-lock.json', 'mobile/frontend/android/gradle.properties', 'mobile/frontend/android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-cmake-cxx-

      - name: Make Gradlew executable
        working-directory: mobile/frontend/android
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Thieu secret ANDROID_KEYSTORE_BASE64 - khong the ky APK release"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prowatch-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/prowatch-release.jks" >> $GITHUB_ENV

      - name: Build Android Release APK
        working-directory: mobile/frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --build-cache --parallel --configure-on-demand -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK signature and permissions
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n 1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | sort -V | tail -n 1)
          APK_PATH="mobile/frontend/android/app/build/outputs/apk/release/app-release.apk"
          $APKSIGNER verify --print-certs "$APK_PATH" | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::APK dang ky bang debug keystore!"
            exit 1
          fi
          $AAPT dump permissions "$APK_PATH" | tee perms.txt
          if grep -E "READ_SMS|RECEIVE_SMS|REQUEST_INSTALL_PACKAGES" perms.txt; then
            echo "::error::APK van chua quyen nhay cam bi Google Play Protect chan!"
            exit 1
          fi
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Prepare APK Asset & Release Metadata
        id: release_meta
        run: |
          cp mobile/frontend/android/app/build/outputs/apk/release/app-release.apk ./ProWatch-Health.apk
          ls -lh ProWatch-Health.apk
          APP_VERSION=$(node -p "require('./mobile/frontend/app.json').expo.version")
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${APP_VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProWatch-Health-APK
          path: ProWatch-Health.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "ProWatch Health ${{ steps.release_meta.outputs.tag_name }} (Build #${{ github.run_number }})"
          body: |
            ### 📱 ProWatch Health Android Release (${{ steps.release_meta.outputs.tag_name }})
            - **Phiên bản ứng dụng:** `${{ steps.release_meta.outputs.app_version }}`
            - **Kiến trúc hỗ trợ:** `arm64-v8a`
            - **Commit:** `${{ github.sha }}`
            - **Tải xuống cài đặt:** Chọn file **`ProWatch-Health.apk`** bên dưới phần **Assets**.
          files: ProWatch-Health.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

