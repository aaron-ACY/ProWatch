name: Mobile Release & APK Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: mobile/frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: mobile/frontend
        run: npx tsc --noEmit

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Cache CMake NDK C++ Build (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            mobile/frontend/android/app/.cxx
            mobile/frontend/node_modules/expo-modules-core/android/.cxx
            mobile/frontend/node_modules/react-native-screens/android/.cxx
            mobile/frontend/node_modules/react-native-safe-area-context/android/.cxx
            mobile/frontend/node_modules/react-native-svg/android/.cxx
          key: ${{ runner.os }}-cmake-cxx-${{ hashFiles('mobile/frontend/package-lock.json', 'mobile/frontend/android/gradle.properties', 'mobile/frontend/android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-cmake-cxx-

      - name: Make Gradlew executable
        working-directory: mobile/frontend/android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: mobile/frontend/android
        run: ./gradlew :app:assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease --build-cache --parallel --configure-on-demand -PreactNativeArchitectures=arm64-v8a

      - name: Prepare APK Asset
        run: |
          cp mobile/frontend/android/app/build/outputs/apk/release/app-release.apk ./ProWatch-Health.apk
          ls -lh ProWatch-Health.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProWatch-Health-APK
          path: ProWatch-Health.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ProWatch-Health.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

