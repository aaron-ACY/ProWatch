server:
  port: 8080
  servlet:
    context-path: /prowatch

spring:
  application:
    name: prowatch-backend
  profiles:
    # Mặc định dùng 'local' để khởi động ngay lập tức không phụ thuộc mạng/mật khẩu
    # Khi muốn kết nối trực tiếp Supabase, chuyển thành 'supabase'
    active: ${SPRING_PROFILES_ACTIVE:local}

---
# ==============================================================================
# 1. PROFILE LOCAL (Khuyên dùng khi dev & test kết nối ESP32-S3)
# Tự động lưu trữ dữ liệu vào file ./data/prowatch, không lo mất mạng/sai mật khẩu
# ==============================================================================
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/prowatch;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ==============================================================================
# 2. PROFILE SUPABASE (Dùng khi đã có mật khẩu Database của Supabase)
# Sử dụng Pooler IPv4 (aws-0-ap-southeast-1.pooler.supabase.com) cổng 6543/5432
# Tránh lỗi UnknownHostException IPv6 trên mạng Việt Nam
# ==============================================================================
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_POOLER_HOST:aws-0-ap-southeast-1.pooler.supabase.com}:6543/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.hyyrkyuarclrpwlpssvc}
    password: ${SPRING_DATASOURCE_PASSWORD:your-supabase-db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
logging:
  level:
    com.huudan.backend: INFO
    org.springframework.web.socket: INFO
