server:
  port: ${PORT:8080}
  servlet:
    context-path: /prowatch

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: prowatch-backend
  profiles:
    # Mặc định dùng 'local' để khởi động ngay lập tức không phụ thuộc mạng/mật khẩu
    # Khi muốn kết nối trực tiếp Supabase, chuyển thành 'supabase'
    active: ${SPRING_PROFILES_ACTIVE:local}

---
# ==============================================================================
# 1. PROFILE LOCAL (Khuyên dùng khi dev & test kết nối ESP32-S3)
# Tự động lưu trữ dữ liệu vào file ./data/prowatch, không lo mất mạng/sai mật khẩu
# ==============================================================================
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/prowatch;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ==============================================================================
# 2. PROFILE SUPABASE (Dùng khi đã có mật khẩu Database của Supabase)
# Sử dụng Pooler IPv4 (aws-0-ap-southeast-1.pooler.supabase.com) cổng 6543/5432
# Tránh lỗi UnknownHostException IPv6 và lỗi prepared statement trên PgBouncer
# ==============================================================================
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SUPABASE_POOLER_HOST:localhost}:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
logging:
  level:
    com.huudan.backend: INFO
    org.springframework.web.socket: INFO
